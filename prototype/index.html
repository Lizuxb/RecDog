<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>录页 · 录音文档工作台</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<header class="topbar">
  <div class="brand"><svg width="25" height="27" viewBox="0 0 25 27" fill="none" aria-hidden="true"><path d="M4 3h13l4 4v17H4z" stroke="currentColor" stroke-width="1.6"/><path d="M8 10v6m4-9v12m4-9v6" stroke="currentColor" stroke-width="1.6"/><path d="M3 24h18" stroke="#d9b653" stroke-width="3"/></svg><strong>录页</strong><span class="demo">演示</span></div>
  <button class="icon mobile-menu" id="menu" aria-label="打开项目导航"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="project-label">城市记忆 · 口述访谈 <span class="muted">/ 工作台</span></div>
  <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索项目中的文字…" aria-label="搜索项目中的文字"><kbd>Ctrl K</kbd></label>
  <div class="top-actions"><button id="confirm"><span data-icon="check"></span><span>确认最终记录</span></button><button id="export"><span data-icon="export"></span><span>导出</span></button></div>
</header>
<aside class="sidebar" aria-label="项目导航">
  <div class="project-card"><div class="eyebrow">当前项目</div><strong>城市记忆 · 口述访谈</strong><div class="subline">2026.11.02 <span>本机项目</span></div></div>
  <div class="nav-heading">项目成员 <button class="icon" id="add-member" aria-label="新建项目成员">+</button></div>
  <div id="members"></div>
  <button class="nav-row add" id="import"><span data-icon="plus"></span>导入录音或文档</button>
  <div class="sidebar-bottom"><button class="nav-row" id="templates"><span data-icon="template"></span>模板库<span class="trailing">2</span></button><button class="nav-row" id="versions"><span data-icon="history"></span>正式版本<span class="trailing" id="version-count">0</span></button><button class="nav-row" id="settings"><span data-icon="settings"></span>工具设置</button><div class="local-note"><span data-icon="folder"></span>数据保存在本机</div></div>
</aside>
<main class="workspace">
  <div class="workspace-heading"><div><div class="breadcrumb">项目成员 <span>/</span> <span id="member-name">陈明远</span> <span>/</span> 文档草稿</div><h1 id="document-name">老街记忆 · 访谈记录</h1></div><button class="quiet" id="history-link"><span data-icon="history"></span>版本记录</button></div>
  <div class="mobile-tabs"><button class="active" data-view="document">文档</button><button data-view="transcript">转写</button></div>
  <div class="panes">
    <section class="document-pane" aria-label="文档编辑区">
      <div class="editor-toolbar"><span class="toolbar-label">正文</span><span class="divider"></span><button class="format" data-command="bold" aria-label="粗体"><b>B</b></button><button class="format" data-command="italic" aria-label="斜体"><i>I</i></button><button class="format" data-command="underline" aria-label="下划线"><u>U</u></button><span class="divider"></span><button class="icon" data-command="undo" aria-label="撤销"><span data-icon="undo"></span></button><button class="icon" data-command="redo" aria-label="重做"><span data-icon="redo"></span></button><button class="target-button" id="set-target"><span data-icon="target"></span>设为录音目标</button></div>
      <div class="target-strip"><span class="target-dot"></span>录音目标 <strong id="target-name">访谈内容</strong><span class="target-hint">点击编辑不会改变目标</span></div>
      <div class="paper-scroll"><article class="paper" id="paper"></article></div>
      <div class="document-footer"><span id="word-count"></span><span id="save-status">草稿已保存 · 演示</span><span>100%</span></div>
    </section>
    <aside class="transcript-pane" aria-label="转写内容">
      <div class="transcript-title"><strong>转写</strong><span class="subtle">本机转写 <span class="status-dot"></span></span></div>
      <div class="transcript-tabs" role="tablist"><button class="active" id="transcript-tab" role="tab" aria-selected="true">录音转写</button><button id="unassigned-tab" role="tab" aria-selected="false">未分配内容 <span id="pending-count">1</span></button></div>
      <div class="recording-meta"><span data-icon="audio"></span><span id="audio-name">访谈录音 01.mp3</span><span>MP3</span></div>
      <div class="transcript-list" id="transcript-list"></div>
      <div class="transcript-bottom"><span id="transcript-state">已转写至 08:32</span><button class="quiet" id="follow"><span data-icon="down"></span>最新内容</button></div>
    </aside>
  </div>
</main>
<footer class="transport">
  <div class="record-controls"><button class="record-button" id="record"><span class="record-dot"></span><span id="record-label">开始录音</span></button><button class="icon" id="pause" aria-label="暂停录音" disabled><span data-icon="pause"></span></button><button class="icon" id="stop" aria-label="结束录音" disabled><span data-icon="stop"></span></button><div class="record-time"><strong id="record-time">00:00:00</strong><span id="record-state">录音就绪</span></div></div>
  <div class="playback"><button class="icon" id="play" aria-label="播放示例录音"><span data-icon="play"></span></button><span id="play-time">03:24</span><input id="seek" type="range" min="0" max="512" value="204" aria-label="音频播放位置"><span>08:32</span><button class="quiet" id="speed" aria-label="播放速度">1×</button></div>
  <button class="device quiet" id="device"><span data-icon="mic"></span>内置麦克风<span data-icon="chevron"></span></button>
</footer>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="dialog"><div class="dialog-header"><div><span class="eyebrow" id="dialog-eyebrow">工作台</span><h2 id="dialog-title"></h2></div><button class="icon" id="close-dialog" aria-label="关闭">×</button></div><div id="dialog-content"></div></dialog>
</body></html>
